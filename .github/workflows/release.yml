name: Multi-Platform Release

on:
  push:
    tags:
      - 'v*.*.*'
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build & Release (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: Windows
            qt_arch: win64_mingw81
          - os: ubuntu-latest
            name: Linux
            qt_arch: gcc_64
          - os: macos-latest
            name: macOS
            qt_arch: clang_64

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # -------------------------------------------------------------
      # WINDOWS BUILD
      # -------------------------------------------------------------
      - name: Install Qt (Windows)
        if: runner.os == 'Windows'
        uses: jurplel/install-qt-action@v3
        with:
          version: '5.15.2'
          host: 'windows'
          target: 'desktop'
          arch: 'win64_mingw81'
          tools: 'tools_mingw81'

      - name: Install Inno Setup (Windows)
        if: runner.os == 'Windows'
        run: |
          choco install innosetup -y --no-progress

      - name: Build & Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          try {
            $ver = $env:GITHUB_REF_NAME -replace '^v',''
            $distDir = (New-Item -ItemType Directory -Path dist -Force).FullName

            # Find and set 64-bit MinGW
            $mingwDir = $null
            $mingwItem = Get-ChildItem -Path "D:\a", "C:\hostedtoolcache", "C:\Qt", $env:RUNNER_TEMP -Filter "g++.exe" -Recurse -ErrorAction SilentlyContinue | Where-Object { $_.FullName -like "*64*" } | Select-Object -First 1
            if ($mingwItem) {
                $mingwDir = $mingwItem.DirectoryName
                Write-Host "Found 64-bit MinGW at: $mingwDir"
                $env:PATH = "$mingwDir;$env:PATH"
            } else {
                throw "64-bit MinGW (g++.exe) was not found!"
            }

            # Find Qt bin directory containing windeployqt.exe
            $qtBin = $null
            foreach ($cand in @($env:QT_ROOT_DIR, $env:QTDIR, $env:Qt5_Dir)) {
                if ($cand -and (Test-Path "$cand\bin\windeployqt.exe")) {
                    $qtBin = (Resolve-Path "$cand\bin").Path
                    break
                }
            }
            if (-not $qtBin) {
                $windeployItem = Get-ChildItem -Path "D:\a", "C:\hostedtoolcache", "C:\Qt", $env:RUNNER_TEMP -Filter "windeployqt.exe" -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1
                if ($windeployItem) {
                    $qtBin = $windeployItem.DirectoryName
                }
            }
            if (-not $qtBin) {
                throw "windeployqt.exe was not found in any search path!"
            }
            Write-Host "Found Qt bin at: $qtBin"
            $env:PATH = "$qtBin;$env:PATH"

            # Update translations
            if (Test-Path "$qtBin\lrelease.exe") {
                & "$qtBin\lrelease.exe" Symphytum.pro
            } else {
                lrelease Symphytum.pro
            }
            if (Test-Path "stuff\translations\symphytum_el.qm") {
                Copy-Item "stuff\translations\symphytum_el.qm" "resources\languages\" -Force
            }

            # Configure and compile with CMake & MinGW 64-bit
            cmake -B build -DCMAKE_BUILD_TYPE=Release -G "MinGW Makefiles" -DCMAKE_C_COMPILER="$mingwDir/gcc.exe" -DCMAKE_CXX_COMPILER="$mingwDir/g++.exe"
            cmake --build build --config Release --parallel

            # Locate built executable
            $exe = Get-ChildItem -Path "build" -Filter "symphytum.exe" -Recurse | Select-Object -First 1
            if (-not $exe) {
                throw "symphytum.exe was not found in build directory!"
            }

            # Prepare staging folder for installer
            $stageDir = (New-Item -ItemType Directory -Path "$distDir\staging" -Force).FullName
            Copy-Item $exe.FullName -Destination "$stageDir\symphytum.exe" -Force

            # Deploy Qt dependencies
            Write-Host "Deploying Qt dependencies via windeployqt..."
            $qmakeExe = "$qtBin\qmake.exe"
            & "$qtBin\windeployqt.exe" --verbose 2 --release --no-translations --compiler-runtime --qmake "$qmakeExe" --dir "$stageDir" "$stageDir\symphytum.exe"
            Write-Host "windeployqt exit code: $LASTEXITCODE"

            # Copy MinGW runtime DLLs
            Copy-Item "$mingwDir\libgcc_s_*.dll" -Destination $stageDir -Force -ErrorAction SilentlyContinue
            Copy-Item "$mingwDir\libstdc++-*.dll" -Destination $stageDir -Force -ErrorAction SilentlyContinue
            Copy-Item "$mingwDir\libwinpthread-*.dll" -Destination $stageDir -Force -ErrorAction SilentlyContinue

            # Ensure essential Qt DLLs and graphics runtimes are in staging folder
            $essentialQtDlls = @("Qt5Core.dll", "Qt5Widgets.dll", "Qt5Gui.dll", "Qt5Network.dll", "Qt5PrintSupport.dll", "Qt5Sql.dll", "Qt5Svg.dll", "Qt5WinExtras.dll", "D3Dcompiler_47.dll", "libEGL.dll", "libGLESv2.dll", "opengl32sw.dll")
            foreach ($dll in $essentialQtDlls) {
                if (-not (Test-Path "$stageDir\$dll")) {
                    if (Test-Path "$qtBin\$dll") {
                        Write-Host "Copying missing $dll from $qtBin to $stageDir"
                        Copy-Item "$qtBin\$dll" -Destination $stageDir -Force
                    }
                }
            }

            # Ensure essential Qt plugin folders are populated in staging folder
            $qtPluginsDir = "$qtBin\..\plugins"
            if (Test-Path $qtPluginsDir) {
                foreach ($pluginDir in @("platforms", "styles", "sqldrivers", "imageformats", "printsupport", "iconengines", "bearer")) {
                    $src = "$qtPluginsDir\$pluginDir"
                    $dst = "$stageDir\$pluginDir"
                    if (Test-Path $src) {
                        if (-not (Test-Path $dst)) {
                            New-Item -ItemType Directory -Path $dst -Force | Out-Null
                        }
                        Copy-Item "$src\*" -Destination $dst -Recurse -Force
                    }
                }
            }

            # Copy OpenSSL DLLs (first from repository stuff\openssl, then runner fallback)
            if (Test-Path "stuff\openssl") {
                Write-Host "Copying repository OpenSSL libraries from stuff\openssl to $stageDir..."
                Copy-Item "stuff\openssl\*.dll" -Destination $stageDir -Force
            }
            $sslSearchPaths = @($mingwDir, $qtBin, "C:\Program Files\OpenSSL-Win64\bin", "C:\OpenSSL-Win64\bin")
            foreach ($sp in $sslSearchPaths) {
                if (Test-Path $sp) {
                    Get-ChildItem -Path $sp -Filter "*.dll" -ErrorAction SilentlyContinue | Where-Object { $_.Name -match "^(lib)?(crypto|ssl)" } | ForEach-Object {
                        if (-not (Test-Path "$stageDir\$($_.Name)")) {
                            Write-Host "Copying SSL dependency: $($_.Name)"
                            Copy-Item $_.FullName -Destination $stageDir -Force
                        }
                    }
                }
            }

            # Verify critical dependencies exist in staging folder
            $criticalDlls = @(
                "Qt5Core.dll", "Qt5Widgets.dll", "Qt5Gui.dll", "Qt5Network.dll",
                "Qt5PrintSupport.dll", "Qt5Sql.dll", "Qt5Svg.dll", "Qt5WinExtras.dll"
            )
            foreach ($dll in $criticalDlls) {
                if (-not (Test-Path "$stageDir\$dll")) {
                    throw "Verification failed: $dll is missing in $stageDir!"
                }
            }

            # Verify MinGW runtime
            if (-not (Get-ChildItem -Path $stageDir -Filter "libstdc++*.dll" -ErrorAction SilentlyContinue)) {
                throw "Verification failed: libstdc++ is missing in $stageDir!"
            }
            if (-not (Get-ChildItem -Path $stageDir -Filter "libwinpthread*.dll" -ErrorAction SilentlyContinue)) {
                throw "Verification failed: libwinpthread is missing in $stageDir!"
            }

            # Verify critical Qt plugins
            if (-not (Test-Path "$stageDir\platforms\qwindows.dll")) {
                throw "Verification failed: platforms\qwindows.dll is missing in $stageDir!"
            }
            if (-not (Test-Path "$stageDir\sqldrivers\qsqlite.dll")) {
                throw "Verification failed: sqldrivers\qsqlite.dll is missing in $stageDir!"
            }
            if (-not (Test-Path "$stageDir\styles\qwindowsvistastyle.dll")) {
                Write-Host "Notice: styles\qwindowsvistastyle.dll not found; Fusion fallback will be used."
            }

            # Verify OpenSSL runtime for HTTPS auto-updates
            if (-not (Test-Path "$stageDir\libcrypto-1_1-x64.dll") -or -not (Test-Path "$stageDir\libssl-1_1-x64.dll")) {
                throw "Verification failed: OpenSSL 1.1 libraries are missing in $stageDir!"
            }

            Write-Host "All critical libraries and plugins verified successfully in staging directory!"
            Get-ChildItem -Path $stageDir | Select-Object Name, Length | Format-Table | Out-String | Write-Host

            # Create portable zip package before installer cleanup
            Write-Host "Creating Windows portable ZIP archive..."
            $portableDir = "$distDir\Symphytum-$ver-Windows-Portable"
            Copy-Item -Path $stageDir -Destination $portableDir -Recurse -Force
            Compress-Archive -Path "$portableDir\*" -DestinationPath "$distDir\Symphytum-$ver-Windows-Portable.zip" -Force
            Remove-Item -Recurse -Force $portableDir

            # Build Inno Setup Installer
            $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
            if (-not (Test-Path $iscc)) {
                $isccItem = Get-ChildItem -Path "C:\Program Files", "C:\Program Files (x86)" -Filter "ISCC.exe" -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1
                if ($isccItem) {
                    $iscc = $isccItem.FullName
                }
            }
            if (-not (Test-Path $iscc)) {
                $isccCmd = Get-Command "ISCC.exe" -ErrorAction SilentlyContinue
                if ($isccCmd) {
                    $iscc = $isccCmd.Source
                }
            }
            if (Test-Path $iscc) {
                Write-Host "Running Inno Setup with ISCC: $iscc"
                & $iscc "/DMyAppVersion=$ver" "/DOutputDir=$distDir" "/DSourceDir=$stageDir" "/DOutputBaseFilename=symphytum-$ver-setup" "stuff\installers\symphytum.iss"
                if ($LASTEXITCODE -ne 0) {
                    throw "ISCC failed with exit code $LASTEXITCODE"
                }
            } else {
                throw "ISCC.exe not found anywhere!"
            }

            # Clean up staging directory
            Remove-Item -Recurse -Force $stageDir
          } catch {
            Write-Host "::error::$_"
            Write-Host "Exception details: $($_.Exception.ToString())"
            Write-Host "ScriptStackTrace: $($_.ScriptStackTrace)"
            throw $_
          }

      # -------------------------------------------------------------
      # LINUX BUILD
      # -------------------------------------------------------------
      - name: Install Linux Dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake libgl1-mesa-dev qttools5-dev-tools

      - name: Install Qt (Linux)
        if: runner.os == 'Linux'
        uses: jurplel/install-qt-action@v3
        with:
          version: '5.15.2'
          arch: 'gcc_64'

      - name: Build & Package (Linux)
        if: runner.os == 'Linux'
        run: |
          ver="${GITHUB_REF_NAME#v}"
          mkdir -p dist

          # Build translations & application
          lrelease Symphytum.pro || true
          cmake -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build --config Release -j$(nproc)

          # Package portable tar.gz
          stageDir="dist/Symphytum-${ver}-Linux-x86_64"
          mkdir -p "$stageDir/bin" "$stageDir/share/applications" "$stageDir/share/icons/hicolor/64x64/apps"
          cp build/symphytum "$stageDir/bin/"
          cp LICENSE "$stageDir/"
          cp README.md "$stageDir/"
          cp resources/images/icons/symphytum.png "$stageDir/share/icons/hicolor/64x64/apps/"
          tar -czvf "dist/Symphytum-${ver}-Linux-x86_64.tar.gz" -C dist "Symphytum-${ver}-Linux-x86_64"

      # -------------------------------------------------------------
      # MACOS BUILD
      # -------------------------------------------------------------
      - name: Install Qt (macOS)
        if: runner.os == 'macOS'
        uses: jurplel/install-qt-action@v3
        with:
          version: '5.15.2'
          arch: 'clang_64'

      - name: Build & Package (macOS)
        if: runner.os == 'macOS'
        run: |
          ver="${GITHUB_REF_NAME#v}"
          mkdir -p dist

          # Build translations & application bundle targeting x86_64 (matching Qt 5.15.2)
          lrelease Symphytum.pro || true
          cmake -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_OSX_ARCHITECTURES=x86_64
          cmake --build build --config Release -j$(sysctl -n hw.ncpu)

          # Find bundle and create DMG / ZIP
          appPath=$(find build -name "symphytum.app" -o -name "Symphytum.app" | head -n 1)
          if [ -d "$appPath" ]; then
            macdeployqt "$appPath" -dmg || true
            dmgPath=$(find build -name "*.dmg" | head -n 1)
            if [ -f "$dmgPath" ]; then
              cp "$dmgPath" "dist/Symphytum-${ver}-macOS.dmg"
            fi
            ditto -c -k --sequesterRsrc --keepParent "$appPath" "dist/Symphytum-${ver}-macOS.zip"
          else
            tar -czvf "dist/Symphytum-${ver}-macOS.tar.gz" -C build symphytum
          fi

      # -------------------------------------------------------------
      # PUBLISH ARTIFACTS TO GITHUB RELEASE
      # -------------------------------------------------------------
      - name: Upload Release Artifacts
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            dist/*.exe
            dist/*.zip
            dist/*.tar.gz
            dist/*.dmg
          generate_release_notes: true
          fail_on_unmatched_files: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  update-readme:
    name: Auto-update README Links
    needs: build-and-release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: master
      
      - name: Update README.md and Update Check
        run: |
          ver="${GITHUB_REF_NAME#v}"
          sed -i -E "s/v[0-9]+\.[0-9]+(\.[0-9]+)?/v${ver}/g" README.md
          sed -i -E "s/symphytum-[0-9]+\.[0-9]+(\.[0-9]+)?/symphytum-${ver}/gi" README.md
          
          # Extract SOFTWARE_BUILD and update raw_check
          build_num=$(grep -oP 'SOFTWARE_BUILD\s*=\s*\K[0-9]+' utils/definitionholder.cpp)
          if [ -n "$build_num" ]; then
            echo "${build_num};" > doc/update/raw_check/latest
          fi
          
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add README.md doc/update/raw_check/latest
          git diff-index --quiet HEAD || git commit -m "docs: auto-update README and update-check to v${ver} [skip ci]"
          git push origin master
